services:
  data-permissions:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 65532:65532 /data"]
    volumes:
      - inventory_data:/data
    restart: "no"

  api:
    image: inventoryapi-api:prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: inventory_api_prod

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inventory-api}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      DATABASE_URL: sqlite:////data/inventory.db
    volumes:
      - inventory_data:/data

    depends_on:
      data-permissions:
        condition: service_completed_successfully

    init: true

volumes:
  inventory_data: