services:
  data-permissions:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 65532:65532 /data"]
    volumes:
      - inventory_data:/data
    restart: "no"

  api:
    image: inventoryapi-api:prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: inventory_api_prod

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: sqlite:////data/inventory.db
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inventory-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
    volumes:
      - inventory_data:/data

    depends_on:
      data-permissions:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped
    init: true

volumes:
  inventory_data: