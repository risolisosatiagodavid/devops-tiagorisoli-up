services:
  inventory-data-permissions:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001 /data"]
    volumes:
      - inventory_data:/data
    restart: "no"

  api:
    image: inventory_api_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: inventory_api_dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - inventory_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////data/inventory.db
      - OTEL_SERVICE_NAME=inventory-api
    depends_on:
      inventory-data-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Permite mandar señales SIGINT/SIGTERM limpias a Uvicorn
    init: true

  k6:
    image: grafana/k6:0.55.0
    profiles: ["load-test"]
    volumes:
      - ./scripts/k6-load-test.js:/scripts/load-test.js:ro
    environment:
      K6_BASE_URL: http://api:8000
    command: ["run", "/scripts/load-test.js"]
    depends_on:
      - api

volumes:
  inventory_data: