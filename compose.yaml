services:
  api:
    image: inventory_api_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: inventory_api_dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - inventory_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=sqlite:////data/inventory.db
      - OTEL_SERVICE_NAME=inventory-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
    # Permite mandar señales SIGINT/SIGTERM limpias a Uvicorn
    init: true

volumes:
  inventory_data: