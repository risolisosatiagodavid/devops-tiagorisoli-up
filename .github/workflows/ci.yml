name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.11

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Validar Conventional Commits
        run: |
          uv run cz check --rev-range origin/main..HEAD

      - name: Correr tests con pytest
        env:
          DATABASE_URL: sqlite:////tmp/inventory-ci.db
        run: |
          uv run pytest -v --cov=app --cov-report=term-missing

      - name: Levantar API para prueba de carga
        run: docker compose up --build --wait --wait-timeout 90 api

      - name: Ejecutar prueba de carga con k6
        run: docker compose --profile load-test run --rm k6

      - name: Limpiar servicios de Compose
        if: always()
        run: docker compose down --volumes --remove-orphans
