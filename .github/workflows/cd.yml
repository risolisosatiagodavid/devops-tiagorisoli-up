name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  run-ci-tests:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: run-ci-tests
    permissions:
      contents: write
    outputs:
      has_release: ${{ steps.bump.outputs.has_release }}
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.11

      - name: Configurar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Alinear baseline con el último tag
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [[ -n "$LATEST_TAG" ]]; then
            VERSION="${LATEST_TAG#v}"
            [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              || { echo "El tag $LATEST_TAG no tiene formato semver" >&2; exit 1; }
            TAG_VERSION="$(git show "${LATEST_TAG}:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p')"
            [[ "$TAG_VERSION" == "$VERSION" ]] \
              || { echo "$LATEST_TAG no coincide con la versión $TAG_VERSION de pyproject.toml" >&2; exit 1; }
            sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" pyproject.toml
            git show "${LATEST_TAG}:CHANGELOG.md" > CHANGELOG.md
          fi
          uv lock --offline
          git add pyproject.toml CHANGELOG.md uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release baseline to ${LATEST_TAG:-project version}"
          fi

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Calcular versión y crear tag
        id: bump
        shell: bash
        run: |
          set +e
          uv run cz bump --yes --annotated-tag
          STATUS=$?
          set -e
          if [[ "$STATUS" -eq 3 ]]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "No hay commits que requieran una nueva versión."
            exit 0
          fi
          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Publicar tag
        id: publish
        if: steps.bump.outputs.has_release == 'true'
        run: |
          set -euo pipefail
          TAG="$(git describe --exact-match --tags HEAD)"
          uv lock --offline
          git add uv.lock
          if ! git diff --cached --quiet; then
            git tag --delete "$TAG"
            git commit --amend --no-edit
            git tag --annotate "$TAG" --message "Release $TAG"
          fi
          git push origin "refs/tags/${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Crear GitHub Release
        if: steps.bump.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes

  build-and-push:
    if: needs.release.outputs.has_release == 'true'
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Validar rama de despliegue
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "CD solo puede desplegar desde main (ref actual: $GITHUB_REF)" >&2
            exit 1
          fi

      - name: Checkout del tag de release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Validar tag de release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "release_tag debe tener formato vMAJOR.MINOR.PATCH" >&2; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] \
            || { echo "El tag $RELEASE_TAG no coincide con project.version $VERSION" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir imagen Docker versionada
        id: meta
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          echo "image=docker.io/${DOCKER_USER}/inventoryapi-api:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/inventoryapi-api:latest

      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          BASE_HOOK=$(printf '%s' "$DEPLOY_HOOK" | sed 's/[?&]imgURL=.*//')
          curl --fail-with-body --silent --show-error -G "$BASE_HOOK" \
            --data-urlencode "imgURL=${IMAGE_URL}"
