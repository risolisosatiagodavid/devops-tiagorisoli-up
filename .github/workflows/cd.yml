name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.11

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Correr tests con pytest
        env:
          DATABASE_URL: sqlite:////tmp/inventory-ci.db
        run: |
          uv run pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/inventoryapi-api    
          tags: |
            type=raw,value=prod
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
              HOOK_CLEAN=$(echo "$DEPLOY_HOOK" | tr -d '[:space:]')
              curl --fail-with-body -sSL -X POST "${HOOK_CLEAN}&imgURL=docker.io/${DOCKER_USER}/inventoryapi-api:prod"
