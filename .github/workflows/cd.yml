name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Leer versión del proyecto
        id: release
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "project.version debe tener formato MAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.11

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Correr tests con pytest
        env:
          DATABASE_URL: sqlite:////tmp/inventory-ci.db
        run: |
          uv run pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir imagen Docker versionada
        id: meta
        run: echo "image=docker.io/${DOCKER_USER}/inventoryapi-api:${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.test.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/inventoryapi-api:${{ needs.test.outputs.version }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/inventoryapi-api:latest


      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          BASE_HOOK=$(printf '%s' "$DEPLOY_HOOK" | sed 's/[?&]imgURL=.*//')
          curl --fail-with-body --silent --show-error -G "$BASE_HOOK" \
            --data-urlencode "imgURL=docker.io/${DOCKER_USER}/inventoryapi-api:${VERSION}"
