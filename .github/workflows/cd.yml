name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  run-ci-tests:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.actor != 'tiagorisoli-devops-app[bot]'
    runs-on: ubuntu-latest
    needs: run-ci-tests
    outputs:
      has_release: ${{ steps.bump.outputs.has_release }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Generar token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar dependencias de desarrollo
        run: uv sync --locked --only-group dev

      - name: Configurar identidad de Git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ secrets.APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Calcular versión, actualizar lockfile y pushear a main
        id: bump
        shell: bash
        run: |
          set +e
          uv run cz bump --yes --annotated-tag
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 21 ]]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "No hay commits que requieran una nueva versión."
            exit 0
          fi

          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi

          TAG="$(git describe --exact-match --tags HEAD)"

          uv lock --offline
          git add uv.lock
          if ! git diff --cached --quiet; then
            git tag --delete "$TAG"
            git commit --amend --no-edit
            git tag --annotate "$TAG" --message "Release $TAG"
          fi

          git push origin HEAD:main --follow-tags

          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Crear GitHub Release
        if: steps.bump.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes

  build-and-push:
    if: needs.release.outputs.has_release == 'true'
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del tag de release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Validar coherencia entre tag y pyproject.toml
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "El tag debe tener formato vMAJOR.MINOR.PATCH" >&2; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] \
            || { echo "El tag $RELEASE_TAG no coincide con project.version $VERSION" >&2; exit 1; }

      - name: Set up Docker Buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir imagen Docker versionada
        id: meta
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.release.outputs.tag }}
        run: echo "image=docker.io/${DOCKER_USER}/inventoryapi-api:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/inventoryapi-api:latest

      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -G "$DEPLOY_HOOK" \
            --data-urlencode "imgURL=${IMAGE_URL}"
